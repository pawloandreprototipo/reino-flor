services:
  postgres:
    image: postgres:16-alpine
    container_name: reino-flor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reinoflor
      POSTGRES_PASSWORD: reinoflor123
      POSTGRES_DB: reinoflor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reinoflor"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reino-flor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
